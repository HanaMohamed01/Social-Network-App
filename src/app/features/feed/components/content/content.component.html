<section aria-label="Your feed" class="min-w-0 space-y-4">
  <article
    class="rounded-2xl border border-slate-200 bg-white p-4 shadow-sm sm:p-5"
  >
    <div class="flex items-center gap-3">
      <div
        class="flex h-11 w-11 shrink-0 items-center justify-center rounded-full bg-blue-100 text-sm font-bold text-mainColor"
        aria-hidden="true"
      >
        HA
      </div>
      <div class="min-w-0">
        <p class="truncate text-sm font-bold text-slate-800">User Name</p>
        <button
          type="button"
          class="mt-1 inline-flex items-center gap-2 rounded-full bg-slate-100 px-3 py-1 text-xs font-medium text-slate-600"
        >
          <i
            class="fa-solid fa-earth-americas text-[11px]"
            aria-hidden="true"
          ></i>
          Public
          <i class="fa-solid fa-chevron-down text-[9px]" aria-hidden="true"></i>
        </button>
      </div>
    </div>

    <label class="sr-only" for="post-draft">Write a post</label>
    <textarea
      id="post-draft"
      rows="4"
      placeholder="What's on your mind, Hana?"
      class="mt-4 block w-full resize-y rounded-xl border border-slate-200 bg-slate-50/70 px-4 py-3 text-sm leading-6 text-slate-700 outline-none placeholder:text-slate-400 focus:border-blue-300 focus:ring-4 focus:ring-blue-50"
    ></textarea>

    <div
      class="mt-4 flex flex-wrap items-center justify-between gap-3 border-t border-slate-100 pt-4"
    >
      <div class="flex flex-wrap items-center gap-2">
        <button
          type="button"
          class="inline-flex items-center gap-2 rounded-lg px-2.5 py-2 text-sm font-medium text-slate-600 transition hover:bg-emerald-50 hover:text-emerald-700"
        >
          <i
            class="fa-regular fa-image text-emerald-600"
            aria-hidden="true"
          ></i>
          Photo/video
        </button>
        <button
          type="button"
          class="inline-flex items-center gap-2 rounded-lg px-2.5 py-2 text-sm font-medium text-slate-600 transition hover:bg-amber-50 hover:text-amber-700"
        >
          <i class="fa-regular fa-face-smile text-amber-500"></i>
          Feeling/activity
        </button>
      </div>
      <button
        type="button"
        class="inline-flex items-center gap-2 rounded-lg bg-mainColor px-5 py-2.5 text-sm font-semibold text-white shadow-sm transition hover:bg-blue-900 focus-visible:outline-none focus-visible:ring-4 focus-visible:ring-blue-200"
      >
        Post
        <i class="fa-regular fa-paper-plane" aria-hidden="true"></i>
      </button>
    </div>
  </article>

  @for (post of postsData; track post._id) {
    <article
      class="overflow-hidden rounded-2xl border border-slate-200 bg-white shadow-sm"
    >
      <div class="flex items-start gap-3 p-4 sm:p-5">
        <div
          class="flex h-11 w-11 shrink-0 items-center justify-center rounded-full bg-amber-100 text-sm font-bold text-amber-800"
          aria-hidden="true"
        >
          <img
            [src]="post.user.photo"
            [alt]="post.user.name"
            class="h-full w-full object-cover rounded-full"
          />
        </div>
        <div class="min-w-0 flex-1">
          <div class="flex items-start justify-between gap-3">
            <div>
              <p class="text-sm font-bold text-slate-800">
                {{ post.user.name }}
              </p>
              <p
                class="mt-1 flex flex-wrap items-center gap-2 text-xs text-slate-500"
              >
                <span>@{{ post.user.username }}</span>
                <span aria-hidden="true">&middot;</span>
                <span>{{ post.createdAt }}</span>
                <span aria-hidden="true">&middot;</span>
                <span class="inline-flex items-center gap-1"
                  ><i
                    class="fa-solid fa-earth-americas text-2xs"
                    aria-hidden="true"
                  ></i>
                  {{ post.privacy }}</span
                >
              </p>
            </div>
            <button
              type="button"
              aria-label="More post options"
              class="flex h-8 w-8 shrink-0 items-center justify-center rounded-full text-slate-500 transition hover:bg-slate-100 hover:text-slate-700"
            >
              <i class="fa-solid fa-ellipsis" aria-hidden="true"></i>
            </button>
          </div>
          @if (post.body) {
            <p
              dir="rtl"
              class="mt-4 text-right text-sm leading-7 text-slate-700"
            >
              {{ post.body }}
            </p>
          }

          @if (post.image) {
            <img [src]="post.image" class="mt-4 rounded-lg" />
          }
        </div>
      </div>
      <div
        class="mx-4 flex items-center justify-between gap-3 border-b border-slate-100 py-3 text-xs text-slate-500 sm:mx-5"
      >
        <span class="inline-flex items-center gap-2"
          ><span
            class="flex h-5 w-5 items-center justify-center rounded-full bg-blue-500 text-2xs text-white"
            ><i class="fa-solid fa-thumbs-up" aria-hidden="true"></i></span
          >{{ post.likesCount }}</span
        >
        <div class="flex flex-wrap items-center justify-end gap-x-3 gap-y-1">
          <span>{{ post.sharesCount }} shares</span>
          <span>{{ post.commentsCount }} comments</span>
        </div>
      </div>

      <div class="grid grid-cols-3 gap-1 p-2">
        <button
          type="button"
          class="inline-flex items-center justify-center gap-2 rounded-lg py-2.5 text-sm font-medium text-slate-600 transition hover:bg-slate-50 hover:text-mainColor"
        >
          <i class="fa-regular fa-thumbs-up" aria-hidden="true"></i>Like
        </button>
        <button
          type="button"
          class="inline-flex items-center justify-center gap-2 rounded-lg py-2.5 text-sm font-medium text-slate-600 transition hover:bg-slate-50 hover:text-mainColor"
        >
          <i class="fa-regular fa-comment" aria-hidden="true"></i>Comment
        </button>
        <button
          type="button"
          class="inline-flex items-center justify-center gap-2 rounded-lg py-2.5 text-sm font-medium text-slate-600 transition hover:bg-slate-50 hover:text-mainColor"
        >
          <i class="fa-solid fa-share-nodes" aria-hidden="true"></i>Share
        </button>
      </div>
    </article>
  }
</section>
